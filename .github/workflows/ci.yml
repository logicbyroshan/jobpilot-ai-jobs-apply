name: CI

# Automatic CI/CD triggers temporarily disabled (retained for manual/future runs)
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

jobs:
  backend-quality:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx fastapi uvicorn sqlalchemy alembic pydantic pydantic-settings asyncpg aiosqlite redis celery

      - name: Run Ruff Linter
        run: ruff check apps/api/

      - name: Run Pytest Test Suite
        run: pytest apps/api/tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build
